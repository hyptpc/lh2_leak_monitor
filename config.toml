# Equipment addresses and shutdown order, used by normal monitor.py startup.
[monitor]
status_file = "/home/sks/share/monitor-tmp/H2tgtPresentStatus.txt"
poll_seconds = 1
wait_seconds = 3600
skip_delay_seconds = 5
log_file = "logs/monitor.log"
lock_file = "runtime/monitor.lock"

[retry]
attempt_timeout_seconds = 10
delay_seconds = 2
max_attempts = 3 # Includes the first attempt.

[triggers]
skip = "/tmp/skip.now"
cancel = "/tmp/cancel.now"
extend = "/tmp/extend.now"

# SSH alias HV1. Live API labels: 1 BAC, 2 KVC-1, 3 KVC-2; no port 0.
[targets.hv12]
name = "HV1 BAC/KVC"
kind = "hv"
host = "192.168.20.12"
port = 8000
ports = [1, 2, 3]

# SSH alias HV2. 0 HTOF Up, 1 HTOF Down, 2 HTOF High, 3 T1.
[targets.hv13]
name = "HV2 HTOF/T1"
kind = "hv"
host = "192.168.20.13"
port = 8000
ports = [0, 1, 2, 3]

# These supplies are controlled by HV3 on monitor2, not monitor3 (.91).
# Only 0 T2 and 2 BH2; leave 1 SCH and the separate HV4 API (:8001) untouched here.
[targets.hv90]
name = "T2/BH2 via monitor2 HV3"
kind = "hv"
host = "192.168.20.90"
port = 8000
ports = [0, 2]

[targets.flow_out]
name = "Outlet mass-flow valve"
kind = "massflow"
host = "192.168.20.17"
port = 4196
address = 1

[targets.flow_in]
name = "Inlet mass-flow valve"
kind = "massflow"
host = "192.168.20.14"
port = 4001
address = 1

[targets.kikusui45]
name = "Kikusui BLC2 Vth"
kind = "kikusui"
host = "192.168.20.45"
port = 5025

[targets.chamber]
name = "CAEN Chamber"
kind = "caen"
host = "192.168.20.51"
slot = 4

[targets.usb12]
name = "Pi .12 USB power"
kind = "usb"
host = "192.168.20.12"
user = "sks"
hub = "1-1"
ports = [1, 2, 3, 4]

[targets.usb13]
name = "Pi .13 USB power"
kind = "usb"
host = "192.168.20.13"
user = "sks"
hub = "1-1"
ports = [1, 2, 3, 4]

[targets.kikusui42]
name = "Kikusui BLC2 (last)"
kind = "kikusui"
host = "192.168.20.42"
port = 5025

# Preserve this order. Each HV/USB port is attempted separately.
[[sequence]]
target = "hv12"
[[sequence]]
target = "hv13"
[[sequence]]
target = "hv90"
[[sequence]]
kind = "massflow_pair"
outlet = "flow_out"
inlet = "flow_in"
[[sequence]]
target = "kikusui45"
[[sequence]]
target = "chamber"
[[sequence]]
kind = "wait"
[[sequence]]
target = "usb12"
[[sequence]]
target = "usb13"
[[sequence]]
target = "kikusui42"
